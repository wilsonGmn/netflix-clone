name: Comprehensive Secret Scanning

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  gitleaks:
    name: Gitleaks (Strict Regex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: TruffleHog (Verified Secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
          
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # ¡SOLUCIÓN! Al quitar 'base' y 'head', TruffleHog escanea 
          # todo el directorio y no falla al comparar commits iguales.
          extra_args: --only-verified 

  semgrep:
    name: Semgrep (Contextual Secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Semgrep Secret Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/secrets
